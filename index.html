<script>
    function scrollToWaitlist() {
        document.getElementById('waitlist').scrollIntoView({ 
            behavior: 'smooth' 
        });
    }

    document.getElementById('waitlistForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const name = document.getElementById('name').value;
        
        // ConvertKit Configuration - REPLACE THESE VALUES
        const CONVERTKIT_FORM_ID = '8442401'; // Replace with your actual Form ID
        const CONVERTKIT_API_KEY = 'PV-CO-DjWEwMEwFChFstxA';  // Replace with your actual API Key
        
        // Show loading state
        const submitButton = e.target.querySelector('button[type="submit"]');
        const originalText = submitButton.innerHTML;
        submitButton.innerHTML = '⏳ Adding you to the list...';
        submitButton.disabled = true;
        
        try {
            const response = await fetch(`https://api.convertkit.com/v3/forms/${CONVERTKIT_FORM_ID}/subscribe`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    api_key: CONVERTKIT_API_KEY,
                    email: email,
                    first_name: name || 'New Subscriber',
                    tags: ['motionmaster-waitlist', 'early-access'] // Optional tags
                })
            });
            
            const data = await response.json();
            
            if (response.ok && data.subscription) {
                // Success! Replace form with success message
                document.getElementById('waitlistForm').innerHTML = `
                    <div class="text-center p-8 bg-green-900/20 rounded-xl border border-green-500/30">
                        <div class="text-6xl mb-4">🎉</div>
                        <h3 class="text-2xl font-bold mb-4 text-green-400">You're on the waitlist!</h3>
                        <p class="text-purple-300 mb-4">
                            Check your email for confirmation.<br>
                            <strong>Your 50% lifetime discount is reserved!</strong>
                        </p>
                        <p class="text-sm text-purple-400">
                            We'll notify you the moment MotionMaster launches.
                        </p>
                    </div>
                `;
                
                // Update counter
                updateWaitlistCounter();
                
                // Optional: Track with analytics
                if (typeof gtag !== 'undefined') {
                    gtag('event', 'signup', {
                        'event_category': 'waitlist',
                        'event_label': 'motionmaster'
                    });
                }
                
            } else {
                throw new Error(data.message || 'Subscription failed');
            }
            
        } catch (error) {
            console.error('ConvertKit Error:', error);
            
            // Reset button and show error
            submitButton.innerHTML = originalText;
            submitButton.disabled = false;
            
            // Show friendly error message
            alert('Oops! Something went wrong. Please try again or email us directly at hello@motionmaster.io');
        }
    });

    // Function to update waitlist counter
    function updateWaitlistCounter() {
        const countElement = document.getElementById('waitlistCount');
        const currentCount = parseInt(countElement.textContent.match(/\d+/)[0]);
        countElement.textContent = `${currentCount + 1}+ waiting`;
    }

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        // You can fetch real subscriber count from ConvertKit API if needed
        // For now, we'll keep the static counter
        console.log('MotionMaster landing page loaded');
    });

    // Optional: Add email validation
    function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
    }

    // Add real-time email validation
    document.getElementById('email').addEventListener('blur', function(e) {
        const email = e.target.value;
        if (email && !isValidEmail(email)) {
            e.target.style.borderColor = '#ef4444';
            // You could add error text here
        } else {
            e.target.style.borderColor = 'rgb(139 92 246 / 0.3)';
        }
    });
</script>
